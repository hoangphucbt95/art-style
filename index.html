<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho phong cách – Nghệ thuật &amp; Thiết kế</title>
<meta name="description" content="Tra cứu phong cách nghệ thuật và phong cách thiết kế theo nhóm. Bấm để chép tên dùng cho prompt.">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Be+Vietnam+Pro:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --ink:#16202E; --mute:#566174; --line:#D3D8E0;
  --display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0F141B; --surface:#171E29; --ink:#E8ECF2; --mute:#9AA5B6; --line:#283243}
}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid hsl(215 90% 55%);outline-offset:2px}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{padding:44px 0 20px}
h1{font:600 clamp(2.2rem,6vw,4rem)/1 var(--display);letter-spacing:-.035em;margin:0 0 12px}
.lede{margin:0;max-width:60ch;color:var(--mute)}

.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.bar-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;padding:8px 18px;border-radius:999px;font-weight:500}
.tabs button span{color:var(--mute);margin-left:6px;font-weight:400}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button[aria-selected="true"] span{color:inherit;opacity:.7}
.search{flex:1 1 220px;min-width:180px}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:#fff}
.chip i{font-style:normal;color:var(--mute);margin-left:5px}
.chip[aria-pressed="true"] i{color:inherit;opacity:.8}

main{padding:26px 0 80px}
.status{color:var(--mute);font-size:13.5px;margin:0 0 18px}
.grp{--band:hsl(var(--h) 62% 90%);--acc:hsl(var(--h) 65% 36%);--pc:hsl(var(--h) 60% 48% / .38);margin:0 0 34px}
@media (prefers-color-scheme:dark){
  .grp{--band:hsl(var(--h) 34% 19%);--acc:hsl(var(--h) 68% 66%);--pc:hsl(var(--h) 60% 62% / .35)}
}
.chip{--acc:hsl(var(--h,215) 65% 36%)}
@media (prefers-color-scheme:dark){.chip{--acc:hsl(var(--h,215) 55% 40%)}}

.band{position:relative;overflow:hidden;display:flex;align-items:baseline;gap:12px;padding:14px 18px;background:var(--band);border-radius:6px 6px 0 0;min-height:58px}
.band h2{position:relative;z-index:1;margin:0;font:600 1.35rem/1.2 var(--display);letter-spacing:-.01em}
.band .n{position:relative;z-index:1;color:var(--mute);font-size:13.5px}
.band::after{content:"";position:absolute;inset:0 0 0 auto;width:min(48%,420px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 65%);mask-image:linear-gradient(90deg,transparent,#000 65%)}
.band[data-p="stripes"]::after{background:repeating-linear-gradient(90deg,var(--pc) 0 5px,transparent 5px 12px)}
.band[data-p="dots"]::after{background:radial-gradient(var(--pc) 28%,transparent 30%) 0 0/14px 14px}
.band[data-p="check"]::after{background:conic-gradient(var(--pc) 25%,transparent 0 50%,var(--pc) 0 75%,transparent 0) 0 0/22px 22px}
.band[data-p="rings"]::after{background:repeating-radial-gradient(circle at 100% 50%,var(--pc) 0 3px,transparent 3px 10px)}
.band[data-p="pixel"]::after{background:conic-gradient(from 90deg at 3px 3px,transparent 90deg,var(--pc) 0) 0 0/12px 12px}
.band[data-p="zig"]::after{background:linear-gradient(135deg,var(--pc) 25%,transparent 25%) -8px 0/16px 16px,linear-gradient(225deg,var(--pc) 25%,transparent 25%) -8px 0/16px 16px}
.band[data-p="lines"]::after{background:repeating-linear-gradient(0deg,var(--pc) 0 1px,transparent 1px 14px)}
.band[data-p="memphis"]::after{background:radial-gradient(var(--pc) 20%,transparent 22%) 0 0/20px 20px,radial-gradient(var(--pc) 20%,transparent 22%) 10px 10px/20px 20px}
.band[data-p="fan"]::after{background:repeating-conic-gradient(from -45deg at 50% 100%,var(--pc) 0 7.5deg,transparent 7.5deg 15deg) 0 0/52px 52px}
.band[data-p="hard"]::after{background:repeating-linear-gradient(-45deg,var(--pc) 0 9px,transparent 9px 18px)}
.band[data-p="scan"]::after{background:repeating-linear-gradient(0deg,var(--pc) 0 2px,transparent 2px 6px)}
.band[data-p="soft"]::after{background:radial-gradient(ellipse at 85% 50%,var(--pc),transparent 70%)}

.list{list-style:none;margin:0;padding:10px;display:grid;gap:8px;background:color-mix(in srgb,var(--band) 35%,var(--surface));border-radius:0 0 6px 6px;
  grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr))}
.list li{position:relative;display:flex;flex-direction:column;background:var(--surface);border-left:4px solid var(--acc);border-radius:3px}
.row{box-sizing:border-box;display:block;padding:0;cursor:pointer;flex:1;color:inherit;text-decoration:none}
.txt{display:block;padding:11px 48px 12px 14px}
.row:hover{background:color-mix(in srgb,var(--band) 45%,var(--surface))}
.row:focus-visible{outline:3px solid hsl(215 90% 55%);outline-offset:-3px}
.thumb{position:relative;display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:hsl(var(--h) 38% 82%);border:0;padding:0;border-radius:0}
@media (prefers-color-scheme:dark){.thumb{background:hsl(var(--h) 22% 26%)}}
.thumb img{display:block;width:100%;height:100%}
button.thumb{cursor:pointer}
.tl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:6px 12px;border-radius:999px;background:rgba(15,20,30,.72);color:#fff;font-size:13px;white-space:nowrap;opacity:0;pointer-events:none}
.editing .thumb.empty .tl,button.thumb:hover .tl,button.thumb:focus-visible .tl{opacity:1}
.nm{display:block;font:600 1.05rem/1.3 var(--display)}
.nm .vi{font-weight:500;color:var(--mute);margin-left:8px;font-size:.92rem;font-family:var(--body)}
.ds{display:block;margin-top:3px;color:var(--mute);font-size:14px}
.cp{position:absolute;bottom:8px;right:8px;width:32px;height:32px;display:grid;place-items:center;border:1px solid transparent;border-radius:8px;background:none;color:var(--mute)}
.cp:hover{border-color:var(--line);color:var(--ink);background:var(--surface)}
.cp svg{width:16px;height:16px}

.empty{padding:50px 0;text-align:center;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s}
.toast.on{opacity:1;transform:translate(-50%,0)}

[hidden]{display:none!important}
.tbtn{padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13.5px}
.tbtn:hover{border-color:var(--mute)}
#editToggle[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.editbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-top:10px}
.editbar p{margin:0;flex:1 1 100%;color:var(--mute);font-size:13px}
button.row{border:0;background:none;width:100%;text-align:left;font:inherit}
.bandbtns{position:relative;z-index:2;margin-left:auto;display:flex;gap:6px}
.bandbtns button{padding:4px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:13px}
.bandbtns button:hover{border-color:var(--mute)}
.none{grid-column:1/-1;padding:10px 14px;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0;width:min(520px,calc(100% - 32px))}
dialog::backdrop{background:rgba(10,15,25,.55)}
#df{padding:22px;display:grid;gap:14px}
#df h3{margin:0;font:600 1.3rem var(--display)}
#df label{display:grid;gap:5px;font-weight:500;font-size:14px}
#df input,#df textarea,#df select{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#df input[type=range]{padding:0;border:0;background:none}
#df small{font-weight:400;color:var(--mute)}
#df .fld{display:grid;gap:5px;font-weight:500;font-size:14px}
.imgctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.imgctl button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
#df .imgctl select{width:auto}
#df .sw{display:inline-block;width:100%;height:14px;border-radius:4px}
.dact{display:flex;gap:8px;align-items:center}
.dact span{flex:1}
.dact button{padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
.dact .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dact .danger{color:#c0392b;border-color:currentColor}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:560px){header.top{padding-top:28px}.tabs{width:100%}.tabs button{flex:1}.nm .vi{display:block;margin:0}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Kho phong cách</h1>
    <p class="lede" id="lede"></p>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="bar-row">
      <div class="tabs" role="tablist" aria-label="Loại phong cách" id="tabs"></div>
      <div class="search"><input id="q" type="search" placeholder="Tìm theo tên hoặc đặc điểm (có thể gõ không dấu)" aria-label="Tìm phong cách" autocomplete="off"></div>
      <button class="tbtn" id="editToggle" aria-pressed="false">Chỉnh sửa</button>
    </div>
    <div class="editbar" id="editbar" hidden>
      <p>Thay đổi được lưu trong trình duyệt này. Bấm vào khung ảnh để thêm ảnh (hoặc kéo thả file vào khung). Muốn mọi người cùng thấy: bấm “Xuất data.json” và “Xuất ảnh (.zip)”, giải nén ảnh ra thư mục images, rồi upload cả hai lên repo GitHub, cạnh index.html.</p>
      <button class="tbtn" data-act="addgroup">Thêm nhóm</button>
      <button class="tbtn" data-act="export">Xuất data.json</button>
      <button class="tbtn" data-act="images">Xuất ảnh (.zip)</button>
      <button class="tbtn" data-act="import">Nhập data.json</button>
      <button class="tbtn" data-act="reset">Khôi phục bản gốc</button>
      <input type="file" id="file" accept="application/json,.json" hidden>
      <input type="file" id="imgfile" accept="image/*" hidden>
    </div>
    <div class="chips" id="chips" aria-label="Lọc theo nhóm"></div>
  </div>
</div>

<main class="wrap" id="main" aria-live="polite"></main>
<dialog id="dlg" aria-label="Chỉnh sửa"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ============================================================

let DATA = {"art":{"label":"Nghệ thuật","groups":[{"name":"Cổ đại – Trung cổ","h":38,"p":"stripes","items":[["Ancient Egypt - Ai Cập cổ đại","Hình tượng phẳng, tư thế quy ước, mang tính biểu tượng…","art-ancient-egypt.webp"],["Classical Greece - Hy Lạp cổ điển","Đề cao tỷ lệ, cơ thể con người và vẻ đẹp lý tưởng…","art-classical-greece.webp"],["Ancient Rome - La Mã cổ đại","Thiên về hiện thực, kiến trúc hoành tráng và tranh khảm…","art-ancient-rome.webp"],["Byzantine","Hình ảnh tôn giáo trang nghiêm, nền vàng và ít chiều sâu…","art-byzantine.webp"],["Romanesque","Hình khối chắc, bố cục tôn giáo và kiến trúc vòm tròn…","art-romanesque.webp"],["Gothic","Thanh thoát, kịch tính, kính màu và kiến trúc vươn cao…","art-gothic.webp"]]},{"name":"Phục hưng – Cận đại","h":350,"p":"dots","items":[["Renaissance – Phục hưng","Hiện thực, phối cảnh chuẩn, giải phẫu và tỷ lệ hài hòa…","art-renaissance.webp"],["Mannerism – Kiểu cách","Cơ thể kéo dài, tư thế phức tạp và màu sắc khác thường…","art-mannerism.webp"],["Baroque","Chuyển động mạnh, ánh sáng kịch tính và cảm xúc lớn…","art-baroque.webp"],["Rococo","Trang trí cầu kỳ, màu pastel và chủ đề quý tộc…","art-rococo.webp"],["Neoclassicism – Tân cổ điển","Cân đối, nghiêm trang, lấy cảm hứng từ Hy–La.","art-neoclassicism.webp"],["Romanticism – Lãng mạn","Cảm xúc mãnh liệt, thiên nhiên hùng vĩ, đề cao cá nhân…","art-romanticism.webp"],["Realism – Hiện thực","Mô tả chân thực đời sống và con người bình thường…","art-realism.webp"],["Academic Art – Hàn lâm","Kỹ thuật chuẩn mực, chủ đề lịch sử và thần thoại…","art-academic-art.webp"]]},{"name":"Nghệ thuật hiện đại","h":215,"p":"check","items":[["Impressionism – Ấn tượng","Ghi lại ánh sáng và khoảnh khắc bằng nét cọ nhanh…","art-impressionism.webp"],["Post-Impressionism – Hậu ấn tượng","Tăng tính biểu cảm, cấu trúc và màu sắc cá nhân…","art-post-impressionism.webp"],["Neo-Impressionism – Tân ấn tượng","Nghiên cứu và sử dụng màu sắc có hệ thống.","art-neo-impressionism.webp"],["Pointillism – const $ = s => document.querySelector(s);
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[đĐ]/g,"d").toLowerCase();
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const split = n => { const m = n.match(/\s[–—-]\s/); return m ? [n.slice(0,m.index).trim(), n.slice(m.index+m[0].length).trim()] : [n.trim(), ""]; };
const total = k => DATA[k].groups.reduce((a,g)=>a+g.items.length,0);
const clone = o => JSON.parse(JSON.stringify(o));
const PATTERNS = {stripes:"Sọc đứng",dots:"Chấm",check:"Caro",rings:"Vòng tròn",pixel:"Pixel",zig:"Zíc zắc",lines:"Đường ngang",memphis:"Memphis",fan:"Quạt",hard:"Sọc chéo đậm",scan:"Scanline",soft:"Mờ dần"};

/* ---------- Lưu trữ ---------- */
const KEY = "kho-phong-cach:data:v1";
function valid(d){
  return !!d && ["art","design"].every(k => d[k] && typeof d[k].label==="string" && Array.isArray(d[k].groups) &&
    d[k].groups.every(g => typeof g.name==="string" && typeof g.h==="number" && typeof g.p==="string" && Array.isArray(g.items) &&
      g.items.every(it => Array.isArray(it) && typeof it[0]==="string" && typeof it[1]==="string")));
}
let hasLocal = false;
try { const raw = localStorage.getItem(KEY); if (raw) { const d = JSON.parse(raw); if (valid(d)) { DATA = d; hasLocal = true; } } } catch {}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(DATA)); hasLocal = true; return true; }
  catch { toast("Không lưu được vào trình duyệt. Hãy bấm “Xuất data.json” để giữ bản chỉnh sửa."); return false; }
}
function commit(){ if (persist()) toast("Đã lưu"); renderStatic(); render(); }

const state = { tab: location.hash === "#design" ? "design" : "art", group: -1, q: "", edit: false };

function renderStatic(){
  $("#lede").textContent = `${total("art")} phong cách nghệ thuật và ${total("design")} phong cách thiết kế, chia theo nhóm. Bấm vào một dòng để mở Pinterest với từ khóa đó, hoặc bấm biểu tượng chép để lấy tên dùng cho prompt.`;
  $("#tabs").innerHTML = Object.keys(DATA).map(k =>
    `<button role="tab" data-tab="${k}" aria-selected="${k===state.tab}">${esc(DATA[k].label)}<span>${total(k)}</span></button>`).join("");
}

const ICON_COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
const ICON_EDIT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';

function render(){
  const d = DATA[state.tab], q = norm(state.q.trim());
  if (state.group >= d.groups.length) state.group = -1;
  document.body.classList.toggle("editing", state.edit);
  $("#editbar").hidden = !state.edit;
  $("#editToggle").setAttribute("aria-pressed", state.edit);
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === state.tab));

  $("#chips").innerHTML =
    `<button class="chip" style="--h:215" data-g="-1" aria-pressed="${state.group===-1}">Tất cả<i>${total(state.tab)}</i></button>` +
    d.groups.map((g,i)=>`<button class="chip" style="--h:${g.h}" data-g="${i}" aria-pressed="${state.group===i}">${esc(g.name)}<i>${g.items.length}</i></button>`).join("");

  let shown = 0, html = "";
  d.groups.forEach((g,gi) => {
    if (state.group !== -1 && state.group !== gi) return;
    const items = g.items.map((it,ii)=>({it,ii})).filter(o => !q || norm(o.it[0]+" "+o.it[1]+" "+g.name).includes(q));
    if (!items.length && !(state.edit && !q)) return;
    shown += items.length;
    const lis = items.map(({it,ii}) => {
      const [en, vi] = split(it[0]);
      const key = it[2] || "", fit = it[3] === "contain" ? "contain" : "cover";
      const src = key ? (local.get(key) || "images/" + encodeURIComponent(key)) : "";
      const img = src ? `<img src="${esc(src)}" alt="" loading="lazy" decoding="async" style="object-fit:${fit}" onerror="this.parentNode.classList.add('empty');this.remove()">` : "";
      const txt = `<span class="txt"><span class="nm">${esc(en)}${vi?`<span class="vi">${esc(vi)}</span>`:""}</span><span class="ds">${esc(it[1])}</span></span>`;
      if (state.edit) {
        return `<li><button type="button" class="thumb${key?"":" empty"}" data-img="${gi},${ii}" aria-label="${key?"Đổi":"Thêm"} ảnh cho ${esc(en)}">${img}<span class="tl">${key?"Đổi ảnh":"＋ Thêm ảnh"}</span></button><button type="button" class="row" data-edit="${gi},${ii}">${txt}</button><button type="button" class="cp" data-edit="${gi},${ii}" aria-label="Sửa ${esc(en)}" title="Sửa">${ICON_EDIT}</button></li>`;
      }
      const url = "https://www.pinterest.com/search/pins/?q=" + encodeURIComponent(en);
      return `<li><a class="row" href="${url}" target="_blank" rel="noopener noreferrer" title="Tìm “${esc(en)}” trên Pinterest"><span class="thumb${key?"":" empty"}">${img}</span>${txt}</a><button type="button" class="cp" data-copy="${esc(en)}" aria-label="Chép tên ${esc(en)}" title="Chép tên">${ICON_COPY}</button></li>`;
    }).join("") || `<li class="none">Nhóm này chưa có phong cách nào.</li>`;
    const btns = state.edit ? `<span class="bandbtns"><button type="button" data-add="${gi}">+ Thêm phong cách</button><button type="button" data-editgroup="${gi}">Sửa nhóm</button></span>` : "";
    const p = PATTERNS[g.p] ? g.p : "soft";
    html += `<section class="grp" style="--h:${g.h}"><div class="band" data-p="${p}"><h2>${esc(g.name)}</h2><span class="n">${items.length} phong cách</span>${btns}</div><ul class="list">${lis}</ul></section>`;
  });

  $("#main").innerHTML = shown || (state.edit && !q)
    ? `<p class="status">${q ? `${shown} kết quả cho “${esc(state.q.trim())}”` : `${shown} phong cách`}</p>${html}`
    : `<div class="empty"><p>Không có phong cách nào khớp “${esc(state.q.trim())}”.</p><p>Thử tên tiếng Anh, tên tiếng Việt hoặc một từ trong phần đặc điểm.</p></div>`;
}

/* ---------- Toast & chép ---------- */
let tt;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(()=>t.classList.remove("on"), 2200); }
async function copy(text){
  try { await navigator.clipboard.writeText(text); }
  catch { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy")}catch{} ta.remove(); }
  toast(`Đã chép “${text}”`);
}

/* ---------- Hộp thoại chỉnh sửa ---------- */
const dlg = $("#dlg");
function openDlg(title, body, onSave, onDelete){
  dlg.innerHTML = `<form id="df"><h3>${esc(title)}</h3>${body}<div class="dact">${onDelete?'<button type="button" class="danger" id="ddel">Xóa</button>':''}<span></span><button type="button" id="dcancel">Hủy</button><button type="submit" class="primary">Lưu</button></div></form>`;
  const f = $("#df");
  f.addEventListener("submit", e => { e.preventDefault(); if (onSave(new FormData(f)) !== false) dlg.close(); });
  $("#dcancel").addEventListener("click", () => dlg.close());
  if (onDelete) $("#ddel").addEventListener("click", () => { if (onDelete() !== false) dlg.close(); });
  dlg.showModal();
  const first = f.querySelector("input,textarea"); if (first) first.focus();
}
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

function editItem(gi, ii){
  const tab = state.tab, d = DATA[tab], isNew = ii < 0;
  const it = isNew ? ["","","",""] : d.groups[gi].items[ii];
  const opts = d.groups.map((g,i)=>`<option value="${i}"${i===gi?" selected":""}>${esc(g.name)}</option>`).join("");
  const imgCtl = isNew ? "" : `<div class="fld"><b>Ảnh minh họa</b><div class="imgctl"><button type="button" id="pickimg">${it[2]?"Đổi ảnh…":"Chọn ảnh…"}</button>${it[2]?'<button type="button" id="rmimg">Xóa ảnh</button>':""}<select name="fit" aria-label="Cách hiển thị ảnh"><option value="cover"${it[3]==="contain"?"":" selected"}>Lấp đầy khung (cắt bớt)</option><option value="contain"${it[3]==="contain"?" selected":""}>Hiện đủ ảnh</option></select></div></div>`;
  openDlg(isNew ? "Thêm phong cách" : "Sửa phong cách",
    `<label>Tên<input name="name" required value="${esc(it[0])}" placeholder="Renaissance – Phục hưng"><small>Dạng “Tên tiếng Anh – Tên tiếng Việt”. Từ khóa Pinterest lấy phần trước dấu “–”.</small></label>
     <label>Đặc điểm<textarea name="desc" rows="4">${esc(it[1])}</textarea></label>
     <label>Nhóm<select name="group">${opts}</select></label>${imgCtl}`,
    fd => {
      const name = fd.get("name").trim(), desc = fd.get("desc").trim(), ng = +fd.get("group");
      if (!name) return false;
      it[0] = name; it[1] = desc; it[2] = it[2] || "";
      if (!isNew) it[3] = fd.get("fit") === "contain" ? "contain" : "";
      if (isNew) d.groups[ng].items.push(it);
      else if (ng !== gi) { d.groups[gi].items.splice(ii,1); d.groups[ng].items.push(it); }
      commit();
    },
    isNew ? null : () => {
      if (!confirm(`Xóa “${it[0]}”?`)) return false;
      if (it[2]) dropImage(it[2]);
      d.groups[gi].items.splice(ii,1); commit();
    });
  const pk = $("#pickimg"); if (pk) pk.addEventListener("click", () => pickImage(it));
  const rm = $("#rmimg"); if (rm) rm.addEventListener("click", () => { dropImage(it[2]); it[2] = ""; commit(); dlg.close(); });
}

function editGroup(gi){
  const d = DATA[state.tab], isNew = gi < 0;
  const g = isNew ? {name:"", h:200, p:"soft", items:[]} : d.groups[gi];
  const pats = Object.entries(PATTERNS).map(([k,v])=>`<option value="${k}"${k===g.p?" selected":""}>${v}</option>`).join("");
  openDlg(isNew ? "Thêm nhóm" : "Sửa nhóm",
    `<label>Tên nhóm<input name="name" required value="${esc(g.name)}" placeholder="Ví dụ: Hậu chiến – Đương đại"></label>
     <label>Màu<input type="range" name="h" min="0" max="360" value="${g.h}"><span class="sw" id="sw" style="background:hsl(${g.h} 62% 70%)"></span></label>
     <label>Họa tiết dải nhóm<select name="p">${pats}</select></label>`,
    fd => {
      const name = fd.get("name").trim(); if (!name) return false;
      const upd = {name, h:+fd.get("h"), p:fd.get("p")};
      if (isNew) { d.groups.push({...upd, items:[]}); state.group = -1; } else Object.assign(g, upd);
      commit();
    },
    isNew ? null : () => {
      if (!confirm(`Xóa nhóm “${g.name}” và ${g.items.length} phong cách trong đó?`)) return false;
      g.items.forEach(i => { if (i[2]) dropImage(i[2]); });
      d.groups.splice(gi,1); state.group = -1; commit();
    });
  const range = dlg.querySelector('[name="h"]');
  range.addEventListener("input", () => { $("#sw").style.background = `hsl(${range.value} 62% 70%)`; });
}

/* ---------- Ảnh: lưu trong IndexedDB của trình duyệt ---------- */
const local = new Map();   // tên file -> blob URL đang dùng để hiển thị
const blobs = new Map();   // tên file -> Blob (để xuất .zip)
let dbp;
const openDb = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open("kho-phong-cach", 1);
  r.onupgradeneeded = () => r.result.createObjectStore("img");
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
}));
const idbRun = async (mode, fn) => { const db = await openDb(); return new Promise((res, rej) => {
  const t = db.transaction("img", mode), r = fn(t.objectStore("img"));
  t.oncomplete = () => res(r && r.result); t.onerror = t.onabort = () => rej(t.error);
}); };
const imgPut = (k, b) => idbRun("readwrite", s => s.put(b, k));
const imgDel = k => idbRun("readwrite", s => s.delete(k)).catch(() => {});
const imgClear = () => idbRun("readwrite", s => s.clear());
async function imgAll(){ const db = await openDb(); return new Promise((res, rej) => {
  const out = [], r = db.transaction("img").objectStore("img").openCursor();
  r.onsuccess = () => { const c = r.result; if (c) { out.push([c.key, c.value]); c.continue(); } else res(out); };
  r.onerror = () => rej(r.error);
}); }

const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const allKeys = () => Object.values(DATA).flatMap(d => d.groups.flatMap(g => g.items.map(i => i[2]).filter(Boolean)));
function newBase(tab, it){
  const used = new Set(allKeys().map(k => k.replace(/\.[^.]+$/, "")));
  const base = `${tab}-${slug(split(it[0])[0]) || "style"}`;
  let k = base, n = 2; while (used.has(k)) k = `${base}-${n++}`;
  return k;
}
function dropImage(key){
  if (!key) return;
  if (local.has(key)) URL.revokeObjectURL(local.get(key));
  local.delete(key); blobs.delete(key); imgDel(key);
}
async function shrink(file){
  let bmp;
  try { bmp = await createImageBitmap(file, {imageOrientation: "from-image"}); }
  catch { bmp = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = bmp.width || bmp.naturalWidth, h = bmp.height || bmp.naturalHeight, sc = Math.min(1, 900 / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  let blob = await new Promise(r => c.toBlob(r, "image/webp", 0.82));
  if (!blob || blob.type !== "image/webp") blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
  return blob;
}
async function setImage(tab, it, file){
  if (!file || !file.type.startsWith("image/")) { toast("Đây không phải file ảnh."); return; }
  try {
    const blob = await shrink(file), ext = blob.type === "image/webp" ? "webp" : "jpg";
    const old = it[2] || "", key = (old ? old.replace(/\.[^.]+$/, "") : newBase(tab, it)) + "." + ext;
    await imgPut(key, blob);
    if (old && old !== key) dropImage(old);
    else if (old && local.has(old)) URL.revokeObjectURL(local.get(old));
    blobs.set(key, blob); local.set(key, URL.createObjectURL(blob)); it[2] = key;
    commit();
  } catch { toast("Không lưu được ảnh này. Thử file JPG/PNG/WebP khác."); }
}
let pending = null;
function pickImage(it){ pending = {tab: state.tab, it}; $("#imgfile").click(); }
$("#imgfile").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = "";
  if (f && pending) setImage(pending.tab, pending.it, f);
});

/* ---------- Xuất / nhập / khôi phục ---------- */
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const exportData = () => download(new Blob([JSON.stringify(DATA, null, 2)], {type: "application/json"}), "data.json");

function crc32(u8){
  if (!crc32.t) { crc32.t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crc32.t[n] = c; } }
  let crc = -1; for (let i = 0; i < u8.length; i++) crc = crc32.t[(crc ^ u8[i]) & 255] ^ (crc >>> 8);
  return (crc ^ -1) >>> 0;
}
function makeZip(files){            // zip không nén, đủ cho ảnh .webp/.jpg
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true);
    lh.setUint16(12, 0x21, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true); lh.setUint16(26, name.length, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(14, 0x21, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true); ch.setUint16(28, name.length, true); ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + size;
  }
  const cdSize = central.reduce((a, b) => a + b.length, 0), end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, files.length, true); end.setUint16(10, files.length, true); end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type: "application/zip"});
}
async function exportImages(){
  const used = new Set(allKeys()), files = [];
  for (const [k, b] of blobs) if (used.has(k)) files.push({name: "images/" + k, data: new Uint8Array(await b.arrayBuffer())});
  if (!files.length) { toast("Chưa có ảnh nào được thêm trong trình duyệt này."); return; }
  download(makeZip(files), "images.zip");
}
$("#file").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!valid(d)) throw 0;
    if (!confirm("Thay toàn bộ dữ liệu hiện tại bằng nội dung file này?")) return;
    DATA = d; state.group = -1; commit();
  } catch { toast("File không đúng định dạng data.json của trang này."); }
});

/* ---------- Sự kiện ---------- */
$("#tabs").addEventListener("click", e => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  state.tab = b.dataset.tab; state.group = -1; history.replaceState(null,"","#"+state.tab); renderStatic(); render();
});
$("#chips").addEventListener("click", e => {
  const b = e.target.closest("[data-g]"); if (!b) return;
  state.group = +b.dataset.g; render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#editToggle").addEventListener("click", () => { state.edit = !state.edit; render(); });
$("#editbar").addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "addgroup") editGroup(-1);
  else if (a === "export") exportData();
  else if (a === "import") $("#file").click();
  else if (a === "images") exportImages();
  else if (a === "reset" && confirm("Xóa mọi chỉnh sửa và ảnh đã thêm trong trình duyệt này, quay về dữ liệu gốc?")) {
    try { localStorage.removeItem(KEY); } catch {}
    imgClear().catch(() => {}).finally(() => location.reload());
  }
});
$("#main").addEventListener("click", e => {
  const c = e.target.closest("[data-copy]"); if (c) return copy(c.dataset.copy);
  const im = e.target.closest("[data-img]"); if (im) { const [gi,ii] = im.dataset.img.split(",").map(Number); return pickImage(DATA[state.tab].groups[gi].items[ii]); }
  const ed = e.target.closest("[data-edit]"); if (ed) { const [gi,ii] = ed.dataset.edit.split(",").map(Number); return editItem(gi, ii); }
  const ad = e.target.closest("[data-add]"); if (ad) return editItem(+ad.dataset.add, -1);
  const eg = e.target.closest("[data-editgroup]"); if (eg) return editGroup(+eg.dataset.editgroup);
});
$("#main").addEventListener("dragover", e => { if (state.edit && e.target.closest("[data-img]")) e.preventDefault(); });
$("#main").addEventListener("drop", e => {
  const t = e.target.closest("[data-img]"); if (!state.edit || !t) return;
  e.preventDefault(); const f = e.dataTransfer.files[0]; if (!f) return;
  const [gi,ii] = t.dataset.img.split(",").map(Number); setImage(state.tab, DATA[state.tab].groups[gi].items[ii], f);
});
addEventListener("hashchange", () => { state.tab = location.hash === "#design" ? "design" : "art"; state.group = -1; renderStatic(); render(); });

renderStatic(); render();

/* Nạp ảnh đã thêm từ trình duyệt */
imgAll().then(all => {
  for (const [k, b] of all) { blobs.set(k, b); local.set(k, URL.createObjectURL(b)); }
  if (all.length) render();
}).catch(() => {});

/* Nếu chưa có chỉnh sửa cục bộ, thử nạp data.json đặt cạnh index.html trong repo */
if (!hasLocal) {
  fetch("data.json", {cache:"no-store"}).then(r => r.ok ? r.json() : null).then(d => {
    if (valid(d)) { DATA = d; renderStatic(); render(); }
  }).catch(() => {});
}
</script>
